<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            text-align: right;
        }
        .card h3 {
            margin-top: 0;
            text-align: center;
            color: #2dd4bf;
        }
        button {
            background-color: #0d9488;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin: 8px 0;
            width: 100%;
        }
        button.checkout {
            background-color: #e11d48;
        }
        button.secondary {
            background-color: #475569;
        }
        select {
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 8px;
            width: 100%;
            background-color: #334155;
            color: white;
            border: 1px solid #64748b;
        }
        .info-box {
            background-color: #1e293b;
            color: #94a3b8;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
            border: 1px dashed #334155;
        }
        .collapsible-header {
            background-color: #334155;
            color: #f8fafc;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        .collapsible-content {
            display: none;
            padding-top: 10px;
        }
        .collapsible-content.open {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>نظام الحضور والانصراف</h2>

        <div class="info-box">
            ⚡ التطبيق يعمل مباشرة. التنبيهات مساعدة وليست إجبارية.
        </div>

        <!-- الواجهة الرئيسية لتسجيل الحضور والانصراف (ظاهرة دائماً ودون أي قيود) -->
        <div class="card">
            <h3>تسجيل الحضور والانصراف</h3>
            <p style="text-align: center; color: #cbd5e1;">اختر العملية المطلوبة للتسجيل الفوري:</p>
            <button id="btnCheckIn" onclick="handleCheckIn()">تسجيل حضور 🟢</button>
            <button id="btnCheckOut" class="checkout" onclick="handleCheckOut()">تسجيل انصراف 🔴</button>
        </div>

        <!-- قسم إعدادات التذكير الصوتي (اختياري بالكامل وغير مقيد) -->
        <div class="card">
            <div class="collapsible-header" onclick="toggleReminderPanel()">
                ⚙️ إعدادات التذكير الصوتي (اختياري)
            </div>
            <div id="reminderContent" class="collapsible-content">
                <p style="font-size: 13px; color: #94a3b8;">هذا النظام يعمل في الخلفية كتذكير صوتي فقط ولا يغلق أو يقيد التطبيق.</p>
                <button id="muteBtn" class="secondary" onclick="toggleMuteApp()">🔊 التذكير مفعل</button>
                
                <label for="toneSelector" style="display: block; margin-top: 12px; font-size: 14px;">اختر نغمة التذكير:</label>
                <select id="toneSelector" onchange="changeAppTone(this.value)">
                    <option value="beep">صفارة قياسية (Beep)</option>
                    <option value="chime">جرس موسيقي (Chime)</option>
                    <option value="success">نغمة نجاح (Success)</option>
                    <option value="alert">تنبيه مميز (Alert)</option>
                    <option value="bell">رنين جرس (Bell)</option>
                    <option value="modern">نغمة عصرية (Modern)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- تضمين ملف الصوت -->
    <script src="soundManager.js"></script>

    <script>
        // ربط قاعدة البيانات في الخلفية
        if (typeof attendanceSound !== 'undefined') {
            attendanceSound.setDatabaseUrl("https://monzer-771977-default-rtdb.europe-west1.firebasedatabase.app");
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof attendanceSound !== 'undefined') {
                document.getElementById('toneSelector').value = attendanceSound.currentTone;
                document.getElementById('muteBtn').innerText = attendanceSound.isMuted ? "🔇 التذكير صامت" : "🔊 التذكير مفعل";
            }
        });

        // فتح/إغلاق لوحة التذكير الاختيارية بسلاسة
        function toggleReminderPanel() {
            const content = document.getElementById('reminderContent');
            content.classList.toggle('open');
        }

        // تسجيل الحضور
        function handleCheckIn() {
            alert("تم تسجيل الحضور بنجاح!");
            if (typeof attendanceSound !== 'undefined') {
                attendanceSound.play('in');
            }
        }

        // تسجيل الانصراف
        function handleCheckOut() {
            alert("تم تسجيل الانصراف بنجاح!");
            if (typeof attendanceSound !== 'undefined') {
                attendanceSound.play('out');
            }
        }

        // تبديل الوضع الصامت للتذكير
        function toggleMuteApp() {
            if (typeof attendanceSound !== 'undefined') {
                const muted = attendanceSound.toggleMute();
                document.getElementById('muteBtn').innerText = muted ? "🔇 التذكير صامت" : "🔊 التذكير مفعل";
            }
        }

        // تغيير ومعاينة النغمة
        function changeAppTone(tone) {
            if (typeof attendanceSound !== 'undefined') {
                attendanceSound.setTone(tone);
                attendanceSound.play('in');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف والصوت</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #12181f;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button {
            background-color: #0d9488;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            width: 80%;
            max-width: 300px;
        }
        button.checkout {
            background-color: #e11d48;
        }
        select {
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            margin-top: 10px;
            width: 80%;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <h2>نظام تنبيهات الحضور والانصراف</h2>

    <div class="card">
        <h3>تسجيل الحضور والانصراف</h3>
        <button id="btnCheckIn" onclick="handleCheckIn()">تسجيل حضور 🟢</button>
        <button id="btnCheckOut" class="checkout" onclick="handleCheckOut()">تسجيل انصراف 🔴</button>
    </div>

    <div class="card">
        <h3>إعدادات الصوت والتنبيه</h3>
        <button id="muteBtn" onclick="toggleMuteApp()">🔊 الصوت مفعل</button>
        <br><br>
        <label for="toneSelector">اختر نغمة التنبيه:</label><br>
        <select id="toneSelector" onchange="changeAppTone(this.value)">
            <option value="beep">صفارة قياسية (Beep)</option>
            <option value="chime">جرس موسيقي (Chime)</option>
            <option value="success">نغمة نجاح (Success)</option>
            <option value="alert">تنبيه مميز (Alert)</option>
        </select>
    </div>

    <!-- تضمين ملف التنبيهات الصوتية -->
    <script src="soundManager.js"></script>

    <script>
        // إعداد الواجهة عند الفتح
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('toneSelector').value = attendanceSound.currentTone;
            document.getElementById('muteBtn').innerText = attendanceSound.isMuted ? "🔇 الصامت مفعل" : "🔊 الصوت مفعل";
        });

        // دالة تسجيل الحضور
        function handleCheckIn() {
            alert("تم تسجيل الحضور بنجاح!");
            attendanceSound.play('in');
        }

        // دالة تسجيل الانصراف
        function handleCheckOut() {
            alert("تم تسجيل الانصراف بنجاح!");
            attendanceSound.play('out');
        }

        // دالة تبديل الصامت
        function toggleMuteApp() {
            const muted = attendanceSound.toggleMute();
            document.getElementById('muteBtn').innerText = muted ? "🔇 الصامت مفعل" : "🔊 الصوت مفعل";
        }

        // دالة تغيير النغمة ومعاينتها
        function changeAppTone(tone) {
            attendanceSound.setTone(tone);
            attendanceSound.play('in');
        }
    </script>
</body>
</html>

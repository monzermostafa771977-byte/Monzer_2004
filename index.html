<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Monzer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monzer">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b1f24;--mu:#667085;--pr:#0f766e;--prt:#fff;--bd:#e4e7ec;--wr:#b42318;--wb:#fef3f2;--ok:#067647;--okb:#ecfdf3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--card:#1a2027;--tx:#eef1f4;--mu:#98a2b3;--pr:#2dd4bf;--prt:#052e2b;--bd:#2b333c;--wr:#fda29b;--wb:#3b1512;--ok:#75e0a7;--okb:#12301f}}
:root[data-theme="dark"]{--bg:#0f1419;--card:#1a2027;--tx:#eef1f4;--mu:#98a2b3;--pr:#2dd4bf;--prt:#052e2b;--bd:#2b333c;--wr:#fda29b;--wb:#3b1512;--ok:#75e0a7;--okb:#12301f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px}
main{padding:14px 14px 90px;max-width:560px;margin:auto}
.brand{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.brand svg{width:42px;height:42px;border-radius:11px}
.brand b{font-size:21px;letter-spacing:.4px;font-family:system-ui,Arial,sans-serif}
h1{font-size:20px;margin:6px 0 2px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:12px;padding:13px;background:var(--pr);color:var(--prt);font-weight:700;width:100%;margin-top:10px}
button.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.x{width:auto;margin:0;padding:6px 10px;background:transparent;color:var(--wr);border:1px solid var(--bd);font-weight:400}
.big{font-size:22px;font-weight:800}
.warn{background:var(--wb);color:var(--wr);border:1px solid var(--wr);border-radius:12px;padding:12px;margin-bottom:12px;font-weight:700}
.bd{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;margin-inline-start:6px}
.bd.w{background:var(--wb);color:var(--wr)}
.bd.o{background:var(--okb);color:var(--ok)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd);font-size:14px}
.li:first-of-type{border-top:0}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.kv b{font-weight:700}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--pr)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:10px 2px;font-size:11px;color:var(--mu);cursor:pointer}
nav a span{display:block;font-size:20px}
nav a.on{color:var(--pr);font-weight:700}
.empty{color:var(--mu);font-size:14px;padding:6px 0}
#inst{position:fixed;left:14px;right:14px;bottom:78px;z-index:20;display:none;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.pill{margin-inline-start:auto;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--okb);color:var(--ok);font-family:system-ui,Arial,sans-serif}
.pill:empty{display:none}
.pill.off{background:var(--wb);color:var(--wr)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var KEY='hodoori_v1',S={salary:0,att:{},leaves:[],ot:[],work:[],shifts:[],rates:{}},tab='today';
try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){S._ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.schedSync)schedSync()}
var p2=function(n){return String(n).padStart(2,'0')};
var ds=function(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
var ts=function(d){return p2(d.getHours())+':'+p2(d.getMinutes())};
var mins=function(t){var a=t.split(':');return +a[0]*60+ +a[1]};
var V=function(id){var e=document.getElementById(id);return e?e.value:''};
var QUOTA={annual:30,casual:7,sick:7},NAMES={annual:'سنوية',casual:'عارضة',sick:'مرضية',comp:'بدل'};
function compUsed(){return S.leaves.filter(function(l){return l.type=='comp'}).reduce(function(a,l){return a+(+l.days||0)},0)}
function compCredits(){var usedIds={},seen={};S.leaves.forEach(function(l){if(l.type=='comp'&&l.sourceWorkId!=null)usedIds[String(l.sourceWorkId)]=1});return S.work.filter(function(w){return w.kind=='weekend'||w.kind=='holiday'}).map(function(w){return {id:String(w.id),date:w.date,kind:w.kind}}).filter(function(w){var k=w.kind+':'+w.date;if(seen[k])return false;seen[k]=1;return !usedIds[w.id]})}
function compEarned(){var seen={};S.work.forEach(function(w){if(w.kind=='weekend'||w.kind=='holiday')seen[w.kind+':'+w.date]=1});return Object.keys(seen).length}
function compBalance(){return compEarned()-compUsed()}
var IN_MAX='07:50',OUT_MIN='15:50';
var TABS=[['today','🕗','الحضور'],['leave','🏖️','الإجازات'],['work','⏱️','السهر والأعياد'],['shift','🔁','الورديات'],['rep','📊','التقرير']];

function qTotal(y,q){return S.leaves.filter(function(l){return +l.date.slice(0,4)==y&&Math.floor((+l.date.slice(5,7)-1)/3)==q}).reduce(function(a,l){return a+l.days},0)}
function mTotal(ym,t){return S.leaves.filter(function(l){return l.date.slice(0,7)==ym&&(!t||l.type==t)}).reduce(function(a,l){return a+l.days},0)}
function used(y,t){return S.leaves.filter(function(l){return +l.date.slice(0,4)==y&&l.type==t}).reduce(function(a,l){return a+l.days},0)}
function qLabel(q){return 'الربع '+(q+1)+' ('+['يناير–مارس','أبريل–يونيو','يوليو–سبتمبر','أكتوبر–ديسمبر'][q]+')'}
function otHours(o){var h=(Math.min(mins(o.to),1140)-Math.max(mins(o.from),960))/60;return Math.max(0,Math.round(h*100)/100)}
function daily(){return (+S.salary||0)/30}
function ovl(a,b,c,d){return Math.max(0,Math.min(b,d)-Math.max(a,c))/60}
function otPay(o){var f=mins(o.from),t=mins(o.to),hr=(+S.salary||0)/240;return hr*(ovl(f,t,960,1080)*1.35+ovl(f,t,1080,1140)*1.7)}
function money(n){return Math.round(n).toLocaleString('en-US')}
function banner(){var n=new Date(),y=n.getFullYear(),q=Math.floor(n.getMonth()/3),t=qTotal(y,q);
 return t>9?'<div class="warn">⚠️ تحذير: إجمالي إجازاتك في '+qLabel(q)+' هو '+t+' أيام، وهذا أكثر من 9 أيام.</div>':''}
function dayName(d){return new Date(d+'T12:00:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}

function vToday(){
 var n=new Date(),d=ds(n),r=S.att[d]||{};
 var late=r.in&&mins(r.in)>mins(IN_MAX),early=r.out&&mins(r.out)<mins(OUT_MIN);
 var h='<h1>تسجيل الحضور</h1><div class="sub">'+n.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div>'+banner();
 h+='<div class="card"><div class="kv"><span>الحضور</span><b class="big">'+(r.in||'--:--')+(r.in?'<span class="bd '+(late?'w':'o')+'">'+(late?'متأخر':'في الموعد')+'</span>':'')+'</b></div>';
 h+='<div class="kv"><span>الانصراف</span><b class="big">'+(r.out||'--:--')+(r.out?'<span class="bd '+(early?'w':'o')+'">'+(early?'قبل الموعد':'تمام')+'</span>':'')+'</b></div>';
 h+='<div class="sub" style="margin:6px 0 0">آخر موعد حضور 7:50 ص، والانصراف من 3:50 م</div>';
 h+='<button data-a="in">تسجيل حضور الآن</button><button data-a="out" class="sec">تسجيل انصراف الآن</button></div>';
 h+='<div class="card"><h2>إدخال يدوي (لو نسيت التسجيل)</h2><label>التاريخ</label><input type="date" id="md" value="'+d+'"><div class="row"><div><label>الحضور</label><input type="time" id="mi"></div><div><label>الانصراف</label><input type="time" id="mo"></div></div><button data-a="man" class="sec">حفظ</button></div>';
 var ks=Object.keys(S.att).sort().reverse().slice(0,10);
 h+='<div class="card"><h2>آخر الأيام</h2>'+(ks.length?ks.map(function(k){var a=S.att[k];return '<div class="li"><span>'+dayName(k)+'<br><small style="color:var(--mu)">'+(a.in||'--')+' ← '+(a.out||'--')+(a.in&&mins(a.in)>mins(IN_MAX)?' • تأخير':'')+'</small></span><button class="x" data-a="delatt" data-k="'+k+'">حذف</button></div>'}).join(''):'<div class="empty">لا توجد تسجيلات بعد</div>')+'</div>';
 return h;
}

function Q(k){var v=S.quota&&S.quota[k];return (v===undefined||v===null||v==='')?QUOTA[k]:+v}
function leaveDays(a,b,incl){var out=[],c=new Date(a+'T12:00:00'),e=new Date(b+'T12:00:00');while(c<=e&&out.length<400){var g=c.getDay();if(incl||(g!=5&&g!=6))out.push(ds(c));c.setDate(c.getDate()+1)}return out}
function vLeave(){
 var n=new Date(),d=ds(n),y=n.getFullYear(),q=Math.floor(n.getMonth()/3),t=qTotal(y,q);
 var h='<h1>الإجازات</h1><div class="sub">رصيد سنة '+y+'</div>'+banner();
 h+='<div class="card"><h2>رصيد إجازاتي السنوي (إدخال يدوي)</h2><div class="sub">أدخل إجمالي الأيام المستحقة لك في السنة حسب شركتك</div><div class="row"><div><label>السنوية</label><input type="number" id="qa" min="0" value="'+Q('annual')+'"></div><div><label>العارضة</label><input type="number" id="qc" min="0" value="'+Q('casual')+'"></div><div><label>المرضية</label><input type="number" id="qs" min="0" value="'+Q('sick')+'"></div></div><button data-a="quota" class="sec">حفظ الأرصدة</button></div>';
 h+='<div class="card"><h2>الرصيد المتبقي</h2>';
 Object.keys(QUOTA).forEach(function(k){var u=used(y,k),qt=Q(k),rem=qt-u;h+='<div class="kv"><span>'+NAMES[k]+'</span><b style="'+(rem<0?'color:var(--wr)':'')+'">المتبقي '+rem+' من '+qt+'</b></div><div class="bar"><i style="width:'+(qt>0?Math.min(100,u/qt*100):0)+'%"></i></div>'});
 h+='<div class="kv" style="margin-top:12px"><span>إجازات البدل المكتسبة</span><b>'+compEarned()+' يوم</b></div><div class="kv"><span>إجازات البدل المستخدمة</span><b>'+compUsed()+' يوم</b></div><div class="kv"><span>رصيد إجازات البدل المتبقي</span><b style="color:var(--ok)">'+compBalance()+' يوم</b></div>';
 h+='<div class="kv" style="margin-top:8px"><span>إجمالي '+qLabel(q)+'</span><b style="'+(t>9?'color:var(--wr)':'')+'">'+t+' يوم</b></div>';
 h+='<div class="kv"><span>إجمالي هذا الشهر</span><b>'+mTotal(d.slice(0,7))+' يوم</b></div></div>';
 h+='<div class="card"><h2>تسجيل إجازة</h2><label>النوع</label><select id="lt"><option value="annual">سنوية</option><option value="casual">عارضة</option><option value="sick">مرضية</option><option value="comp">بدل</option></select><div class="row" id="leaveDates"><div><label id="leaveStartLabel">بداية الإجازة</label><input type="date" id="ld" value="'+d+'"></div><div id="leaveEndWrap"><label>نهاية الإجازة</label><input type="date" id="le" value="'+d+'"></div></div><div id="compFields" style="display:none"><label>بدل عن يوم العمل في</label><select id="compSource">'+(compCredits().map(function(c){return '<option value="'+c.id+'">'+dayName(c.date)+' — '+(c.kind=='holiday'?'عيد رسمي':'جمعة / سبت')+'</option>'}).join(''))+'</select><div class="sub">يُخصم يوم كامل من رصيد البدل، ويُسجل تاريخ يوم العمل الذي اكتسبت عنه البدل.</div></div><div id="normalLeaveFields"><label>مدة الإجازة</label><select id="lpart"><option value="1">يوم كامل</option><option value="0.5">نصف يوم (0.5)</option></select><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="lw" style="width:auto"> احسب الجمعة والسبت ضمن الإجازة</label><div class="sub" style="margin-top:6px">الإجازة الكاملة تُحسب بالأيام من البداية إلى النهاية، مع استثناء الجمعة والسبت ما لم تفعّل الخيار. نصف اليوم يُسجّل لتاريخ واحد فقط.</div></div><button data-a="leave">حفظ الإجازة</button><div id="lm" class="sub" style="color:var(--wr)"></div></div>';
 var g={};S.leaves.forEach(function(l){var k=l.gid||l.id;(g[k]=g[k]||{k:k,type:l.type,sourceDate:l.sourceDate||'',ds:[],n:0}).ds.push(l.date);g[k].n+=l.days});
 var ls=Object.keys(g).map(function(k){var o=g[k];o.ds.sort();return o}).sort(function(a,b){return a.ds[0]<b.ds[0]?1:-1}).slice(0,15);
 h+='<div class="card"><h2>سجل الإجازات</h2>'+(ls.length?ls.map(function(o){var f=o.ds[0],e=o.ds[o.ds.length-1];return '<div class="li"><span>'+(f==e?dayName(f):'من '+dayName(f)+'<br>إلى '+dayName(e))+'<br><small style="color:var(--mu)">'+NAMES[o.type]+' • '+o.n+' يوم'+(o.type=='comp'&&o.sourceDate?' • بدل عن '+dayName(o.sourceDate):'')+'</small></span><button class="x" data-a="dell" data-i="'+o.k+'">حذف</button></div>'}).join(''):'<div class="empty">لا توجد إجازات مسجلة</div>')+'</div>';
 return h;
}
function vLeaveOld(){
 var n=new Date(),y=n.getFullYear(),q=Math.floor(n.getMonth()/3),t=qTotal(y,q);
 var h='<h1>الإجازات</h1><div class="sub">رصيد سنة '+y+'</div>'+banner();
 h+='<div class="card"><h2>الرصيد المتبقي</h2>';
 Object.keys(QUOTA).forEach(function(k){var u=used(y,k),rem=QUOTA[k]-u;h+='<div class="kv"><span>'+NAMES[k]+'</span><b style="'+(rem<0?'color:var(--wr)':'')+'">المتبقي '+rem+' من '+QUOTA[k]+'</b></div><div class="bar"><i style="width:'+Math.min(100,u/QUOTA[k]*100)+'%"></i></div>'});
 h+='<div class="kv" style="margin-top:12px"><span>إجازات البدل المكتسبة</span><b>'+compEarned()+' يوم</b></div><div class="kv"><span>إجازات البدل المستخدمة</span><b>'+compUsed()+' يوم</b></div><div class="kv"><span>رصيد إجازات البدل المتبقي</span><b style="color:var(--ok)">'+compBalance()+' يوم</b></div>';
 h+='<div class="kv" style="margin-top:8px"><span>إجمالي '+qLabel(q)+'</span><b style="'+(t>9?'color:var(--wr)':'')+'">'+t+' يوم</b></div>';
 h+='<div class="kv"><span>إجمالي هذا الشهر</span><b>'+mTotal(ds(n).slice(0,7))+' يوم</b></div></div>';
 h+='<div class="card"><h2>تسجيل إجازة</h2><label>النوع</label><select id="lt"><option value="annual">سنوية</option><option value="casual">عارضة</option><option value="sick">مرضية</option></select><div class="row"><div><label>تاريخ البداية</label><input type="date" id="ld" value="'+ds(n)+'"></div><div><label>عدد الأيام</label><input type="number" id="ln" value="1" min="0.5" step="0.5"></div></div><button data-a="leave">حفظ الإجازة</button></div>';
 var ls=S.leaves.slice().sort(function(a,b){return a.date<b.date?1:-1}).slice(0,15);
 h+='<div class="card"><h2>سجل الإجازات</h2>'+(ls.length?ls.map(function(l){return '<div class="li"><span>'+dayName(l.date)+'<br><small style="color:var(--mu)">'+NAMES[l.type]+' • '+l.days+' يوم</small></span><button class="x" data-a="dell" data-i="'+l.id+'">حذف</button></div>'}).join(''):'<div class="empty">لا توجد إجازات مسجلة</div>')+'</div>';
 return h;
}

function vWork(){
 var n=new Date(),d=ds(n),ym=d.slice(0,7),dl=daily();
 function mo(a){return a.filter(function(x){return x.date.slice(0,7)==ym})}
 var os=mo(S.ot),ws=mo(S.work.filter(function(w){return w.kind=='weekend'})),hs=mo(S.work.filter(function(w){return w.kind=='holiday'}));
 var oh=os.reduce(function(a,o){return a+otHours(o)},0),op=os.reduce(function(a,o){return a+otPay(o)},0);
 var wp=ws.length*dl,hp=hs.length*2*dl;
 function wl(arr,mult,chk){return arr.length?arr.slice().sort(function(a,b){return a.date<b.date?1:-1}).map(function(w){var g=new Date(w.date+'T12:00:00').getDay();return '<div class="li"><span>'+dayName(w.date)+(chk&&g!=5&&g!=6?'<span class="bd w">ليس جمعة أو سبت</span>':'')+'<br><small style="color:var(--mu)">'+money(mult*dl)+' جنيه'+(chk?' + يوم بدل':'')+'</small></span><button class="x" data-a="delw" data-i="'+w.id+'">حذف</button></div>'}).join(''):'<div class="empty">لا توجد أيام هذا الشهر</div>'}
 var h='<h1>السهر والأعياد</h1><div class="sub">متابعة شهر '+ym+' (الحساب تلقائي)</div>';
 if(!(+S.salary))h+='<div class="warn">أدخل مرتبك الشهري أولاً ليحسب التطبيق المبالغ.</div>';
 h+='<div class="card"><h2>المرتب الشهري (إدخال يدوي)</h2><div class="row"><div><input type="number" id="sal" value="'+(S.salary||'')+'" placeholder="أدخل مرتبك الشهري"></div><div><button data-a="sal" style="margin-top:0">حفظ</button></div></div><div class="kv"><span>اليومية (المرتب ÷ 30)</span><b>'+money(dl)+' جنيه</b></div><div class="kv"><span>أجر الساعة (المرتب ÷ 240)</span><b>'+money(dl/8)+' جنيه</b></div></div>';
 h+='<div class="card"><h2>إجمالي المستحق هذا الشهر</h2><div class="kv"><span>السهر</span><b>'+money(op)+' جنيه</b></div><div class="kv"><span>الجمعة والسبت</span><b>'+money(wp)+' جنيه</b></div><div class="kv"><span>الأعياد الرسمية</span><b>'+money(hp)+' جنيه</b></div><div class="kv"><span>أيام البدل المستحقة</span><b>'+ws.length+' يوم</b></div><div class="kv"><span>الإجمالي</span><b class="big">'+money(op+wp+hp)+' جنيه</b></div></div>';

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الحضور والانصراف</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .card {
            background-color: #1e293b;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        button {
            background-color: #0d9488;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin: 8px 0;
            width: 100%;
        }
        button.checkout {
            background-color: #e11d48;
        }
        button.secondary {
            background-color: #475569;
        }
        select {
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
            background-color: #334155;
            color: white;
            border: 1px solid #64748b;
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background-color: #1e293b;
            padding: 10px;
            border-radius: 12px;
            margin-top: 20px;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            width: auto;
        }
        .nav-btn.active {
            color: #2dd4bf;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>نظام الحضور والانصراف</h2>

        <!-- الشاشة الرئيسية (تفتح تلقائياً عند الإقلاع) -->
        <div id="mainScreen" class="screen active">
            <div class="card">
                <h3>لوحة التسجيل السريع</h3>
                <p>مرحباً بك، يمكنك تسجيل الحضور أو الانصراف فوراً</p>
                <button id="btnCheckIn" onclick="handleCheckIn()">تسجيل حضور 🟢</button>
                <button id="btnCheckOut" class="checkout" onclick="handleCheckOut()">تسجيل انصراف 🔴</button>
            </div>
        </div>

        <!-- شاشة الإعدادات والتنبيهات (مخفية افتراضياً ولا تفتح عند الإقلاع) -->
        <div id="settingsScreen" class="screen">
            <div class="card">
                <h3>إعدادات التنبيهات الصوتية</h3>
                <button id="muteBtn" class="secondary" onclick="toggleMuteApp()">🔊 الصوت مفعل</button>
                <br><br>
                <label for="toneSelector">اختر نغمة التنبيه عالية النقاء:</label>
                <select id="toneSelector" onchange="changeAppTone(this.value)">
                    <option value="beep">صفارة قياسية (Beep)</option>
                    <option value="chime">جرس موسيقي (Chime)</option>
                    <option value="success">نغمة نجاح (Success)</option>
                    <option value="alert">تنبيه مميز (Alert)</option>
                    <option value="bell">رنين جرس (Bell)</option>
                    <option value="modern">نغمة عصرية (Modern)</option>
                </select>
            </div>
        </div>

        <!-- شريط التنقل السفلي -->
        <div class="nav-bar">
            <button class="nav-btn active" id="navMain" onclick="switchScreen('main')">🏠 الرئيسية</button>
            <button class="nav-btn" id="navSettings" onclick="switchScreen('settings')">⚙️ الإعدادات والصوت</button>
        </div>
    </div>

    <!-- تضمين ملف الصوت -->
    <script src="soundManager.js"></script>

    <script>
        // ربط رابط قاعدة البيانات في الخلفية دون تعطيل التشغيل الفوري
        if (typeof attendanceSound !== 'undefined') {
            attendanceSound.setDatabaseUrl("https://monzer-771977-default-rtdb.europe-west1.firebasedatabase.app");
        }

        // تهيئة الواجهة عند الإقلاع وتأكيد فتح الشاشة الرئيسية حصراً
        document.addEventListener('DOMContentLoaded', () => {
            switchScreen('main'); // ضمان البدء من الواجهة الرئيسية دائماً
            if (typeof attendanceSound !== 'undefined') {
                document.getElementById('toneSelector').value = attendanceSound.currentTone;
                document.getElementById('muteBtn').innerText = attendanceSound.isMuted ? "🔇 الصامت مفعل" : "🔊 الصوت مفعل";
            }
        });

        // دالة التنقل بين الشاشات
        function switchScreen(screenName) {
            const mainScreen = document.getElementById('mainScreen');
            const settingsScreen = document.getElementById('settingsScreen');
            const navMain = document.getElementById('navMain');
            const navSettings = document.getElementById('navSettings');

            if (screenName === 'main') {
                mainScreen.classList.add('active');
                settingsScreen.classList.remove('active');
                navMain.classList.add('active');
                navSettings.classList.remove('active');
            } else {
                settingsScreen.classList.add('active');
                mainScreen.classList.remove('active');
                navSettings.classList.add('active');
                navMain.classList.remove('active');
            }
        }

        // تسجيل الحضور مع تشغيل الصوت الفوري عالي النقاء
        function handleCheckIn() {
            alert("تم تسجيل الحضور بنجاح!");
            if (typeof attendanceSound !== 'undefined') {
                attendanceSound.play('in');
            }
        }

        // تسجيل الانصراف مع تشغيل الصوت الفوري
        function handleCheckOut() {
            alert("تم تسجيل الانصراف بنجاح!");
            if (typeof attendanceSound !== 'undefined') {
                attendanceSound.play('out');
            }
        }

        // تبديل وضع الصامت
        function toggleMuteApp() {
            if (typeof attendanceSound !== 'undefined') {
                const muted = attendanceSound.toggleMute();
                document.getElementById('muteBtn').innerText = muted ? "🔇 الصامت مفعل" : "🔊 الصوت مفعل";
            }
        }

        // تغيير ومعاينة النغمة
        function changeAppTone(tone) {
            if (typeof attendanceSound !== 'undefined') {
                attendanceSound.setTone(tone);
                attendanceSound.play('in');
            }
        }
    </script>
</body>
</html>
